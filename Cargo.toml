[workspace]
resolver = "3"
members = ["crates/*"]

# Shared settings
[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carlvillads/illuminator"
publish = false

[workspace.dependencies]
thiserror = "2"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
tempfile = "3"
nifti = { version = "0.18", default-features = false }
memmap2 = "0.9.11"
rayon = "1.12.0"
gpui-kit = "=0.7.1"
futures = "0.3"
image = { version = "0.25", default-features = false }
url = "2"
interprocess = "2.4"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
embed-resource = "3"
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
