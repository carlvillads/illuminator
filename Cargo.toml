[workspace]
resolver = "3"
members = ["crates/*"]

# Shared settings
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
flate2 = "1.1.10"
tempfile = "3"
nifti = { version = "0.18", default-features = false }
memmap2 = "0.9.11"
rayon = "1.12.0"
png = "0.18.1"
