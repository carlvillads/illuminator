[package]
name = "illuminator-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "illuminate"
path = "src/main.rs"

[dependencies]
illuminator-core = { path = "../illuminator-core" }
gpui-kit.workspace = true
futures.workspace = true
image = { workspace = true, features = ["png"] }
url.workspace = true
interprocess.workspace = true
clap.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
embed-resource.workspace = true

[package.metadata.packager]
product-name = "Illuminator"
identifier = "io.github.carlvillads.illuminator"
description = "A viewer for medical nifti files"
category = "Medical"
authors = ["Carl Villads Priisholm"]
publisher = "Carl Villads Priisholm"
binaries = [{ path = "illuminate", main = true }]
before-packaging-command = "cargo about generate about.hbs -o ../../target/THIRD_PARTY_LICENSES.html && cargo build --release -p illuminator-app"
out-dir = "../../target/packages"
icons = ["packaging/macos/illuminator.icns", "packaging/linux/icons/*.png"]
resources = [
    { src = "packaging/macos/Assets.car", target = "Assets.car" },
    { src = "../../target/THIRD_PARTY_LICENSES.html", target = "THIRD_PARTY_LICENSES.html" },
]

[package.metadata.packager.macos]
info-plist-path = "packaging/macos/Info.plist"
minimum-system-version = "11.0"
signing-identity = "-"

# Per-user windows installer
[package.metadata.packager.nsis]
installer-icon = "packaging/windows/illuminator.ico"
preinstall-section = '''
Section FileTypes
  WriteRegStr SHCTX "Software\Classes\Illuminator.NIfTI" "" "NIfTI image"
  WriteRegStr SHCTX "Software\Classes\Illuminator.NIfTI\DefaultIcon" "" "$INSTDIR\${MAINBINARYNAME}.exe,0"
  WriteRegStr SHCTX "Software\Classes\Illuminator.NIfTI\shell\open\command" "" '"$INSTDIR\${MAINBINARYNAME}.exe" "%1"'
  WriteRegStr SHCTX "Software\Classes\.nii" "" "Illuminator.NIfTI"
  WriteRegStr SHCTX "Software\Classes\.nii\OpenWithProgids" "Illuminator.NIfTI" ""
  WriteRegStr SHCTX "Software\Classes\.gz\OpenWithProgids" "Illuminator.NIfTI" ""
  System::Call "shell32::SHChangeNotify(i 0x08000000, i 0, p 0, p 0)"
SectionEnd

Section un.FileTypes
  DeleteRegKey SHCTX "Software\Classes\Illuminator.NIfTI"
  DeleteRegValue SHCTX "Software\Classes\.nii\OpenWithProgids" "Illuminator.NIfTI"
  DeleteRegValue SHCTX "Software\Classes\.gz\OpenWithProgids" "Illuminator.NIfTI"
  ReadRegStr $0 SHCTX "Software\Classes\.nii" ""
  StrCmp $0 "Illuminator.NIfTI" 0 +2
    DeleteRegValue SHCTX "Software\Classes\.nii" ""
  System::Call "shell32::SHChangeNotify(i 0x08000000, i 0, p 0, p 0)"
SectionEnd
'''

# Debian, Ubuntu
[package.metadata.packager.deb]
section = "science"
depends = [
    "libfontconfig1",
    "libfreetype6",
    "libvulkan1",
    "libwayland-client0",
    "libwayland-cursor0",
    "libx11-xcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
]
desktop-template = "packaging/linux/illuminator.desktop"
files = { "packaging/linux/nifti.xml" = "usr/share/mime/packages/illuminator.xml" }
