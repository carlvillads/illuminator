name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CITATION.cff"
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/package.yml"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CITATION.cff"
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  release-files:
    name: Changelog and AppStream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo.toml, CHANGELOG.md, and the metainfo agree on version
        run: bash .github/scripts/release-notes.sh
      - name: Validate the AppStream metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net --explain \
            crates/illuminator-app/packaging/linux/io.github.carlvillads.illuminator.metainfo.xml

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
