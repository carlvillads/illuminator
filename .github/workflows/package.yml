name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo packager --release -p illuminator-app
      - uses: actions/upload-artifact@v4
        with:
          name: illuminator-windows
          path: target/packages/*-setup.exe
          if-no-files-found: error

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools and libraries
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo packager --release -p illuminator-app --formats deb
      - uses: actions/upload-artifact@v4
        with:
          name: illuminator-debian
          path: target/packages/*.deb
          if-no-files-found: error

  debian-install:
    name: Install on Debian 12
    needs: debian
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: illuminator-debian
      - name: Install the package and check it
        run: |
          apt-get update
          apt-get install -y shared-mime-info ./*.deb
          # every library the program links to must have come with the dependencies
          if ldd /usr/bin/illuminate | grep "not found"; then exit 1; fi
          grep "nii.gz" /usr/share/mime/globs2
          cat /usr/share/applications/illuminate.desktop
          # software centers read the app's description from here
          test -f /usr/share/metainfo/io.github.carlvillads.illuminator.metainfo.xml
  
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed git namcap shared-mime-info desktop-file-utils
          # makepkg refuses to run as root, so it builds as a user that may install dependencies
          useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Prepare the PKGBUILD and source archive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          install -d -o builder /build
          sed "s/^pkgver=.*/pkgver=$version/" crates/illuminator-app/packaging/arch/PKGBUILD > /build/PKGBUILD
          git archive --format=tar.gz --prefix="illuminator-$version/" \
            --output="/build/illuminator-$version.tar.gz" HEAD
          chown -R builder /build
      - name: Build and test the package
        working-directory: /build
        run: sudo -H -u builder makepkg --syncdeps --noconfirm
      - name: Check and install the package
        working-directory: /build
        run: |
          namcap PKGBUILD ./*.pkg.tar.zst | tee namcap.log
          # namcap prints problems as warnings (W:) and errors (E:); only errors fail the job
          if grep -q " E: " namcap.log; then exit 1; fi
          pacman -U --noconfirm ./*.pkg.tar.zst
          # every library the program links to must have come with the dependencies
          if ldd /usr/bin/illuminate | grep "not found"; then exit 1; fi
          illuminate --version
          grep "nii.gz" /usr/share/mime/globs2
          desktop-file-validate /usr/share/applications/illuminate.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: illuminator-arch
          path: /build/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian, debian-install, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create draft release with packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" packages/*
          --draft --notes-file notes.md --title "Illuminator ${GITHUB_REF_NAME#v}"
